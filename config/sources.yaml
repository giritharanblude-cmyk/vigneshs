source_tiers:
  tier1:
    name: Primary / Official Sources
    priority: 1
    domains:
      - oecd.org
      - ilo.org
      - weforum.org
      - unesco.org
      - worldbank.org
      - bls.gov
      - ec.europa.eu
      - eurostat.ec.europa.eu
      - labor.gov
      - stats.bls.gov
      - gov.uk
      - abs.gov.au
      - statcan.gc.ca

  tier2:
    name: High-Quality Research
    priority: 2
    domains:
      - nature.com
      - science.org
      - thelancet.com
      - ieee.org
      - acm.org
      - elsevier.com
      - springer.com
      - ssrn.com
      - arxiv.org

  tier3:
    name: Structured Market Evidence
    priority: 3
    domains:
      - linkedin.com
      - microsoft.com
      - coursera.org
      - lightcast.io
      - burning-glass.com
      - indeed.com
      - glassdoor.com

  tier4:
    name: Discovery-Only Sources
    priority: 4
    domains:
      - reuters.com
      - bloomberg.com
      - techcrunch.com
      - wired.com
      - forbes.com
      - hbr.org
      - medium.com

